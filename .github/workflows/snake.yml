name: Generate Neon Snake Animation
on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (optional)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate animated SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: m1dnxt404
          outputs: |
            dist/github-snake.svg?color_snake=#00fff2&color_dots=#39ff14,#0affc2,#00ffd9,#0fffe0,#00ffec
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00fff2&color_dots=#39ff14,#0affc2,#00ffd9,#0fffe0,#00ffec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}